name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uvx ruff check
      - run: uvx ruff format --check

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python }}
          # caches the llama-cpp-python wheel built from source, which is the slow part
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked --extra cpu
      - name: Test
        # --no-sync: a plain `uv run` would re-sync without the cpu extra (and swap torch builds)
        run: uv run --no-sync pytest -v --cov --cov-report=term-missing

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Audit locked dependencies for known vulnerabilities
        # The torch extras conflict, so each variant is exported and audited separately.
        # Local torch builds (+cpu/+cu130/+rocm7.2) are audited as the matching PyPI release, and packages that
        # aren't on PyPI at all (triton-rocm) are skipped, as are packages removed with an
        # impossible `sys_platform == 'never'` override (never installed, see override-dependencies in pyproject.toml).
        # PYSEC-2026-2447 (diskcache pickle, no fix available) is only reachable via llama-cpp-python's optional
        # LlamaDiskCache, which ragga doesn't use.
        run: |
          for extra in cpu gpu rocm; do
            echo "::group::audit [$extra]"
            uv export --locked --extra "$extra" --extra eval --all-groups --no-emit-project --no-hashes \
                --format requirements-txt \
              | grep -vE "^triton-rocm|sys_platform == 'never'" \
              | sed -E 's/^(torch==[0-9.]+)\+[a-z0-9.]+/\1/' > "requirements-audit-$extra.txt"
            uvx pip-audit --strict --disable-pip --no-deps --progress-spinner off \
              --ignore-vuln PYSEC-2026-2447 -r "requirements-audit-$extra.txt"
            echo "::endgroup::"
          done
